name: Feature request
description: Propose a new capability or change in behaviour.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do that the generator doesn't support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see instead. Alternatives you considered, if any.
    validations:
      required: true
