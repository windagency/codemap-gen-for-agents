name: Bug report
description: Something in the codemap generator isn't working as expected.
labels: ["needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a command that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `codemap --version`, or the commit SHA you're running.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and any other relevant detail.
    validations:
      required: false
