name: Publish

on:
  push:
    branches: [main, "release/**"]

# Husky's documented CI setting: pnpm install's prepare script then activates no git hooks on the runner.
# They're developer feedback; CI runs the real checks, and @semantic-release/git's release commit needs none.
env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deployment branches: main and release/** only. npm's Trusted Publisher for this package names this
    # environment, so a publish token can only be minted for a run that passed its branch policy.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it makes setup-node write an .npmrc with a NODE_AUTH_TOKEN placeholder token, which npm
      # would send instead of the OIDC (Trusted Publishing) credential that `npm stage publish` relies on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run lint:css

      - run: pnpm run typecheck

      - run: pnpm run licenses:check

      - run: pnpm run backlinks:check

      - run: pnpm test

      - run: pnpm run build

      # Attached to the GitHub Release by @semantic-release/github (release.config.js `assets`). It lists the
      # repository's whole lockfile, dev tooling included, not only the published package's dependencies.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: v1.54.1
          config: .github/syft.yaml
          upload-artifact: false
          upload-release-assets: false

      # GITHUB_TOKEN can't be a ruleset bypass actor, so it can't push the release commit or tag past the
      # main/release/tags rulesets. This App can: it's on their bypass lists, see documentation/DEPLOYMENT.md.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write

      # NPM_CONFIG_IGNORE_SCRIPTS: @semantic-release/npm takes the last line of `npm pack`'s stdout as the tarball
      # name, and pack runs `prepare` (husky), whose "HUSKY=0 skip install" has no trailing newline and lands on
      # that line. dist/ is already built above; no other lifecycle script matters to the release.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
