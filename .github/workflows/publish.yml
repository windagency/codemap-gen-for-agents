name: Publish

on:
  push:
    branches: [main, "release/**"]

# Husky's documented CI setting: pnpm install's prepare script then activates no git hooks on the runner.
# They're developer feedback; CI runs the real checks, and @semantic-release/git's release commit needs none.
env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deployment branches: main and release/** only. npm's Trusted Publisher for this package names this
    # environment, so a publish token can only be minted for a run that passed its branch policy.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # No registry-url: it makes setup-node write an .npmrc whose token is a NODE_AUTH_TOKEN placeholder, and
      # @semantic-release/npm uses any token it finds in an .npmrc before it ever reads NPM_TOKEN.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run lint:css

      - run: pnpm run typecheck

      - run: pnpm run licenses:check

      - run: pnpm run backlinks:check

      - run: pnpm test

      - run: pnpm run build

      # Attached to the GitHub Release by @semantic-release/github (release.config.js `assets`). It lists the
      # repository's whole lockfile, dev tooling included, not only the published package's dependencies.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: v1.54.1
          config: .github/syft.yaml
          upload-artifact: false
          upload-release-assets: false

      # GITHUB_TOKEN can't be a ruleset bypass actor, so it can't push the release commit or tag past the
      # main/release/tags rulesets. This App can: it's on their bypass lists, see documentation/DEPLOYMENT.md.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write

      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
